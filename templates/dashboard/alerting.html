<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Alert - DGCB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #09090b;
        }
        .title-font {
            font-family: 'Oswald', sans-serif;
        }
        .glow-gold {
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.6);
        }
        .glow-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
        }
    </style>
</head>
<body class="w-screen min-h-screen text-white flex items-center justify-center p-4">

    <!-- Portrait Mobile Container -->
    <div class="w-full max-w-sm bg-zinc-950/90 border-2 border-cyan-500/80 rounded-3xl p-5 shadow-[0_0_35px_rgba(6,182,212,0.25)] flex flex-col justify-between space-y-4 relative overflow-hidden">
        
        <!-- Background Sci-Fi Grid -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#06b6d408_1px,transparent_1px),linear-gradient(to_bottom,#06b6d408_1px,transparent_1px)] bg-[size:16px_16px] pointer-events-none"></div>

        <!-- Top Header with Back Button -->
        <div class="flex items-center justify-between z-10 border-b border-zinc-800 pb-2">
            <a href="/dashboard/telling" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-xl font-bold transition-all flex items-center space-x-1">
                <span>← Kembali</span>
            </a>
            <div class="text-right">
                <span class="text-[9px] font-bold tracking-[0.2em] text-cyan-400 uppercase">Live Overlay</span>
                <h1 class="title-font text-lg font-black italic tracking-wide text-white uppercase leading-none">Hi Admin!</h1>
            </div>
        </div>

        <!-- User Summary Card -->
        <div class="z-10 bg-zinc-900/80 border border-zinc-800 rounded-2xl p-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="{{ user.profile_picture_url }}" alt="Avatar" class="w-10 h-10 object-cover rounded-xl border border-cyan-400/50">
                <div>
                    <span class="title-font text-sm font-black italic text-cyan-300 uppercase block">@{{ user.username }}</span>
                    <span class="text-[10px] text-zinc-400">Poin Anda</span>
                </div>
            </div>
            <div class="text-right">
                <span id="userPoints" class="title-font text-xl font-black text-yellow-400 glow-gold" data-points="{{ user.points }}">{{ user.points }}</span>
                <span class="text-[10px] font-bold text-yellow-600 block">PTS</span>
            </div>
        </div>

        <!-- Header Title Pesan Teks -->
        <div class="z-10 bg-zinc-900 p-2 rounded-xl border border-zinc-800 text-center">
            <span class="text-xs font-black italic uppercase text-cyan-400 tracking-wider">💬 Kirim Pesan Teks ke Layar</span>
        </div>

        <!-- Form Section -->
        <div class="z-10 space-y-3">
            
            <!-- SECTION MESSAGE -->
            <div id="sectionMessage" class="space-y-3">
                <div class="space-y-1">
                    <div class="flex justify-between items-center text-[11px] text-zinc-400 px-1">
                        <span>Pesan untuk Layar (Live)</span>
                        <span id="wordCount">0 kata</span>
                    </div>
                    <textarea id="msgInput" rows="4" oninput="calculateMessageCost()"
                        placeholder="Tulis pesan kesatria Anda di sini... (500 pts / 10 kata)" 
                        class="w-full bg-zinc-900 border border-zinc-700 focus:border-cyan-400 rounded-xl p-3 text-xs text-white focus:outline-none transition-colors placeholder-zinc-600 resize-none"></textarea>
                </div>

                <!-- Tier Info Message -->
                <div class="bg-black/50 border border-zinc-800 rounded-2xl p-2.5 text-[10px] space-y-1 text-zinc-300">
                    <div class="flex justify-between font-bold text-cyan-300">
                        <span>Ketentuan Biaya Pesan:</span>
                        <span id="msgCostDisplay">500 Pts</span>
                    </div>
                    <p class="text-zinc-400">• 1 - 10 Kata = 500 Pts | 11 - 20 Kata = 1.000 Pts | 21 - 30 Kata = 1.500 Pts, dst.</p>
                </div>
            </div>

            <!-- Alert / Status Notification Box -->
            <div id="alertBox" class="hidden p-2 rounded-xl text-[11px] font-bold text-center"></div>

            <!-- Submit Button UI -->
            <button type="button" id="submitAlertBtn" onclick="submitAlert()"
                class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-black text-sm italic tracking-wider uppercase rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all transform active:scale-95">
                Kirim Alert Ke Layar (500 PTS)
            </button>
        </div>

        <!-- Footer Accent -->
        <div class="text-center z-10 pt-1">
            <p class="text-[10px] tracking-widest text-zinc-500 uppercase">Kerajaan DGCB /// Alert System</p>
        </div>
    </div>

    <script>
        let calculatedCost = 500;

        function calculateMessageCost() {
            const message = document.getElementById('msgInput').value.trim();
            const wordCount = message ? message.split(/\s+/).length : 0;
            calculatedCost = Math.max(1, Math.ceil(wordCount / 10)) * 500;

            document.getElementById('wordCount').innerText = `${wordCount} kata`;
            document.getElementById('msgCostDisplay').innerText = `${calculatedCost.toLocaleString()} Pts`;
            document.getElementById('submitAlertBtn').innerText = `Kirim Alert Ke Layar (${calculatedCost.toLocaleString()} PTS)`;
        }

        async function submitAlert() {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('hidden', 'bg-red-500/20', 'text-red-400', 'bg-emerald-500/20', 'text-emerald-400');

            const messageText = document.getElementById('msgInput').value.trim();
            if (!messageText) {
                alertBox.classList.add('bg-red-500/20', 'text-red-400');
                alertBox.innerText = 'Pesan tidak boleh kosong!';
                return;
            }

            try {
                // Kirim pesan ke backend, biarkan server yang validasi & potong poin di database
                const response = await fetch('/api/trigger/msg-alert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alertBox.classList.add('bg-emerald-500/20', 'text-emerald-400');
                    alertBox.innerText = result.message;
                    
                    // Update sisa poin di DOM secara real-time berdasarkan balasan server
                    const pointsEl = document.getElementById('userPoints');
                    if (result.remaining_points != null && Number.isFinite(Number(result.remaining_points))) {
                        const remainingPoints = Number(result.remaining_points);
                        pointsEl.setAttribute('data-points', remainingPoints);
                        pointsEl.innerText = remainingPoints.toLocaleString();
                    }

                    // Kosongkan input pesan
                    document.getElementById('msgInput').value = '';
                    calculateMessageCost();
                } else {
                    // Jika server menolak (misal poin kurang), tampilkan pesan error dari server
                    alertBox.classList.add('bg-red-500/20', 'text-red-400');
                    alertBox.innerText = result.message || 'Gagal mengirim alert.';
                }
            } catch (err) {
                console.error(err);
                alertBox.classList.add('bg-red-500/20', 'text-red-400');
                alertBox.innerText = 'Terjadi kesalahan koneksi ke server.';
            }
        }
    </script>
</body>
</html>
