<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kesatria - DGCB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #09090b;
        }
        .title-font {
            font-family: 'Oswald', sans-serif;
        }
        .glow-gold {
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.6);
        }
        .glow-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
        }
        .skew-box {
            clip-path: polygon(4% 0, 100% 0, 96% 100%, 0% 100%);
        }
    </style>
</head>
<body class="w-screen min-h-screen text-white flex items-center justify-center p-4">

    <!-- Portrait Mobile Container -->
    <div class="w-full max-w-sm bg-zinc-950/90 border-2 border-yellow-500/80 rounded-3xl p-6 shadow-[0_0_35px_rgba(234,179,8,0.25)] flex flex-col justify-between space-y-6 relative overflow-hidden">
        
        <!-- Background Sci-Fi Grid -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#eab30808_1px,transparent_1px),linear-gradient(to_bottom,#eab30808_1px,transparent_1px)] bg-[size:16px_16px] pointer-events-none"></div>

        <!-- Top Header -->
        <div class="flex items-center justify-between z-10 border-b border-zinc-800 pb-3">
            <div>
                <span class="text-[10px] font-bold tracking-[0.2em] text-yellow-500 uppercase">Status Kesatria</span>
                <h1 class="title-font text-xl font-black italic tracking-wide text-white uppercase leading-none">Dashboard DGCB</h1>
            </div>
            <a href="/logout" class="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/40 px-3 py-1.5 rounded-xl font-bold transition-all">
                Keluar
            </a>
        </div>

        <!-- User Profile & Stats Card -->
        <div class="z-10 flex flex-col items-center space-y-4 py-2">
            <!-- Profile Avatar with Glow Border -->
            <div class="relative w-24 h-24 rounded-2xl p-1 bg-gradient-to-tr from-yellow-500 to-amber-600 shadow-[0_0_20px_rgba(234,179,8,0.4)]">
                <img src="{{ user.profile_picture_url }}" alt="Avatar" class="w-full h-full object-cover rounded-xl bg-black">
            </div>

            <!-- Username & Email -->
            <div class="text-center space-y-0.5">
                <div class="bg-zinc-900/90 border border-cyan-400/40 px-4 py-1 rounded-lg inline-block shadow-sm">
                    <span class="title-font text-lg font-black italic tracking-wider text-cyan-300 glow-cyan uppercase">@{{ user.username }}</span>
                </div>
                <p class="text-xs text-zinc-400 font-medium">{{ user.email }}</p>
            </div>

            <!-- Points / Stats Box -->
            <div class="w-full bg-zinc-900/80 border border-yellow-500/40 rounded-2xl p-4 flex items-center justify-between shadow-inner">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold tracking-widest text-zinc-400 uppercase">Total Points</span>
                    <span class="text-xs font-semibold text-yellow-500/80">Koleksi Poin Live</span>
                </div>
                <div class="flex items-center space-x-1.5">
                    <span class="title-font text-3xl font-black italic tracking-tighter text-yellow-400 glow-gold">{{ user.points }}</span>
                    <span class="text-xs font-bold text-yellow-600">PTS</span>
                </div>
            </div>
        </div>

        <!-- Info Badge -->
        <div class="z-10 bg-black/60 border border-zinc-800 rounded-2xl p-3 text-center">
            <p class="text-[11px] text-zinc-400 italic">Akun Anda telah terverifikasi dan terhubung secara resmi dengan sistem interaksi TikTok Live Kerajaan DGCB.</p>
        </div>

        <!-- Footer Accent -->
        <div class="text-center z-10 pb-1">
            <p class="text-[10px] tracking-widest text-zinc-500 uppercase">Kerajaan DGCB /// Official Portal</p>
        </div>
    </div>

</body>
</html>
