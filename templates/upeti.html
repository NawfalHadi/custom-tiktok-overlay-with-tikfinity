<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upeti Broadcast Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Oswald', sans-serif;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-content {
            display: inline-flex;
            white-space: nowrap;
            animation: tickerScroll 15s linear infinite;
        }

        /* Attention bounce animation for the gift badge */
        @keyframes badgeBounce {
            0% { transform: scale(1); }
            30% { transform: scale(1.3) rotate(12deg); }
            60% { transform: scale(0.9) rotate(-6deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .badge-pulse { animation: badgeBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body class="w-screen h-screen flex gap-4 items-end justify-start p-8 bg-transparent">

    <!-- PERSISTENT UPETI WIDGET (STREAM OVERLAY BOTTOM BAR) -->
    <div id="upeti-widget" class="relative flex flex-col w-[620px] gap-1 transition-all duration-500">
        
        <!-- USER PROFILE IMAGE MATCHING WIDGET HEIGHT -->
        <div class="relative h-[92px] w-[80px] bg-slate-950 border-4 border-emerald-500 rounded-xl shadow-2xl overflow-hidden flex justify-center items-center shrink-0 transform skew-x-[6deg]">
            <img id="user-avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80" alt="Profile" class="h-full w-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-40"></div>
            <div class="absolute bottom-1 bg-emerald-600 text-white text-[8px] font-black uppercase px-1 py-0.5 rounded shadow border border-yellow-400">
                SUPPORTER
            </div>
        </div>

        <!-- TOP RUNNING TEXT TICKER -->
        <div class="w-full h-7 bg-emerald-950/95 border-t border-b border-yellow-400 flex items-center overflow-hidden shadow-xl transform skew-x-6">
            <div class="ticker-content text-yellow-400 font-bold tracking-[0.2em] text-xs uppercase">
                UPETI COMMAND NETWORK // SPECIAL TRIBUTE DISPATCHED // LIVE CONTRIBUTOR STREAM // UPETI COMMAND NETWORK // 
            </div>
        </div>

        <!-- MAIN LAYOUT BAR -->
        <div class="relative flex items-stretch gap-2 w-full h-16">
            
           <!-- LEFT LOGO BLOCK -->
            <div class="relative bg-gradient-to-tr from-emerald-600 to-emerald-400 text-black px-6 flex flex-col justify-center items-center font-black italic tracking-tighter skew-x-[6deg] shadow-lg border-2 border-yellow-400 shrink-0">
                <span class="text-[10px] tracking-widest uppercase leading-none text-emerald-950">UPETI</span>
                <span class="text-2xl leading-none text-white">RECORDS</span>
            </div>

            <!-- CENTER TEXT BLOCK -->
            <div class="flex-1 bg-slate-950/95 border-y-2 border-emerald-500 flex items-center px-6 skew-x-[6deg] shadow-lg">
                <div id="user-title" class="text-yellow-400 font-extrabold text-lg tracking-wide uppercase truncate">
                    @PEMENTOLAN <span class="text-white font-normal">MENGIRIMKAN UPETI</span>
                </div>
            </div>

            <!-- RIGHT GIFT BADGE -->
            <div id="gift-badge-container" class="relative -ml-8 z-30 flex items-center justify-center shrink-0">
                <div class="relative w-16 h-16 flex items-center justify-center bg-gradient-to-tr from-yellow-500 via-yellow-400 to-amber-300 text-black rounded-full shadow-[0_0_20px_rgba(250,204,21,0.9)] border-3 border-yellow-400">
                    <div class="absolute inset-1 rounded-full flex items-center justify-center bg-black/50 overflow-hidden">
                        <img id="gift-icon-img" src="https://img.icons8.com/color/96/gift.png" alt="Gift" class="w-9 h-9 object-contain">
                    </div>
                    <div class="absolute -bottom-1 -right-1 bg-red-600 text-white font-black text-xs px-2 py-0.5 rounded-full border-2 border-black shadow-lg">
                        <span id="gift-count-display">x1</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io({ transports: ['polling'] });

        // Handle Persistent Bar Visibility State & Data Sync
        socket.on('update_upeti_state', (state) => {
            const container = document.getElementById('upeti-widget');
            if (container) {
                if (state.active) {
                    container.style.opacity = '1';
                    container.style.pointerEvents = 'auto';
                } else {
                    container.style.opacity = '0';
                    container.style.pointerEvents = 'none';
                }
            }
            updateData(state);
        });

        function updateData(data) {
            if (data.username) {
                document.getElementById('user-title').innerHTML = `@${data.username.toUpperCase()} <span class="text-white font-normal">MENGIRIMKAN UPETI</span>`;
            }
            if (data.avatarUrl) {
                document.getElementById('user-avatar-img').src = data.avatarUrl;
            }
            if (data.giftCount) {
                document.getElementById('gift-count-display').innerText = `x${data.giftCount}`;
            }
            if (data.giftIconUrl) {
                document.getElementById('gift-icon-img').src = data.giftIconUrl;
            }

            // Trigger bounce animation on the gift badge
            const badge = document.getElementById('gift-badge-container');
            badge.classList.remove('badge-pulse');
            void badge.offsetWidth;
            badge.classList.add('badge-pulse');
        }
    </script>
</body>
</html>
