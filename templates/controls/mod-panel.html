<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderator Panel // Admin HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-3 sm:p-6">
    <div class="max-w-7xl mx-auto space-y-4 sm:space-y-6">

        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-zinc-800 pb-3 sm:pb-4 gap-2 sm:gap-4">
            <div>
                <h1 class="text-lg sm:text-2xl font-black tracking-wider text-cyan-400 uppercase">// Moderator Panel</h1>
                <p class="text-[11px] sm:text-xs text-zinc-500 mt-1">View viewers (read-only) and show comments on screen.</p>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-semibold text-zinc-400 uppercase tracking-widest">System Online</span>
            </div>
        </div>

        <!-- Phone: stacked. Desktop: viewers 2 / comments 1 side by side -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 items-start">

            <!-- VIEWERS (read-only, compact rows) -->
            <div class="md:col-span-2 bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="bg-zinc-950 px-3 sm:px-4 py-3 border-b border-zinc-800 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-widest text-zinc-400">Viewers <span id="viewerCount" class="text-amber-400">(0)</span></span>
                    <input type="text" id="searchInput" placeholder="Search username..." oninput="renderViewers()"
                           class="bg-zinc-900 text-xs px-3 py-2 rounded-lg border border-zinc-800 focus:outline-none focus:border-cyan-500 text-white w-full sm:w-48">
                </div>

                <ul id="viewersList" class="divide-y divide-zinc-800/60 max-h-[60vh] md:max-h-[75vh] overflow-y-auto"></ul>
            </div>

            <!-- COMMENTS (with show trigger) -->
            <div class="md:col-span-1 bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="bg-zinc-950 px-3 sm:px-4 py-3 border-b border-zinc-800 flex justify-between items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-widest text-zinc-400">Comments <span id="commentCount" class="text-amber-400">(0)</span></span>
                    <button onclick="clearShown()" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded-lg text-[10px] font-bold uppercase tracking-wider border border-zinc-700 transition-all">
                        Clear Screen
                    </button>
                </div>

                <!-- Currently on screen -->
                <div class="px-3 sm:px-4 py-3 border-b border-zinc-800 bg-cyan-500/5">
                    <p class="text-[10px] font-bold uppercase tracking-widest text-cyan-400 mb-1">On Screen</p>
                    <p id="onScreenText" class="text-xs text-zinc-500 italic break-words">Nothing shown.</p>
                </div>

                <ul id="commentList" class="divide-y divide-zinc-800/60 overflow-y-auto max-h-[50vh] md:max-h-[70vh]"></ul>
            </div>

        </div>
    </div>

    <script>
        // Static data for now
        const viewers = [
            { id: 1, username: 'KesatriaBiru',  verified: true,  points: 128500, member: true,  role: 'VIP',       joined: '2026-01-12' },
            { id: 2, username: 'DewiSenja',     verified: true,  points: 97200,  member: true,  role: 'Moderator', joined: '2026-02-03' },
            { id: 3, username: 'GarudaMuda',    verified: false, points: 85040,  member: false, role: '-',         joined: '2026-03-18' },
            { id: 4, username: 'ArjunaID',      verified: true,  points: 71310,  member: true,  role: '-',         joined: '2026-04-22' },
            { id: 5, username: 'LangitTerang',  verified: true,  points: 4200,   member: false, role: '-',         joined: '2026-09-07' },
            { id: 6, username: 'PasirPutih',    verified: false, points: 3100,   member: false, role: '-',         joined: '2026-10-15' },
            { id: 7, username: 'RajaKecil',     verified: true,  points: 1900,   member: false, role: '-',         joined: '2026-11-01' }
        ];

        const comments = [
            { id: 101, username: 'LangitTerang', message: 'Gas terus kak, semangat live-nya!', time: '20:14' },
            { id: 102, username: 'PasirPutih',   message: 'Halo dari Banjarmasin',              time: '20:15' },
            { id: 103, username: 'RajaKecil',    message: 'Suara kakak jelas banget hari ini',  time: '20:17' },
            { id: 104, username: 'DewiSenja',    message: 'Kapan giveaway berikutnya?',         time: '20:19' }
        ];

        let shownCommentId = null;

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Compact row: name on top, small meta line below (wraps on phone), points on the right
        function renderViewers() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const list = viewers.filter(v => v.username.toLowerCase().includes(q));
            document.getElementById('viewerCount').textContent = `(${list.length})`;

            const ul = document.getElementById('viewersList');
            if (list.length === 0) {
                ul.innerHTML = `<li class="py-6 text-center text-xs text-zinc-500">No viewers found.</li>`;
                return;
            }

            ul.innerHTML = list.map(v => {
                const account = v.verified
                    ? '<span class="text-cyan-400">Verified</span>'
                    : '<span class="text-red-400">Unowned</span>';
                const member = v.member
                    ? '<span class="text-emerald-400">MEMBER</span>'
                    : '<span class="text-zinc-500">NON-MEMBER</span>';

                return `
                    <li class="px-3 sm:px-4 py-2.5 hover:bg-zinc-800/40 transition-colors flex justify-between items-center gap-3">
                        <div class="min-w-0">
                            <p class="text-sm font-bold text-white truncate">${escapeHtml(v.username)}</p>
                            <p class="text-[10px] leading-relaxed text-zinc-500">
                                <span class="font-mono">#${v.id}</span> · ${account} · ${member} · Role: ${escapeHtml(v.role)} · ${v.joined}
                            </p>
                        </div>
                        <p class="text-sm font-black text-amber-400 shrink-0 whitespace-nowrap">${Number(v.points).toLocaleString()} <span class="text-[10px] font-bold">PTS</span></p>
                    </li>
                `;
            }).join('');
        }

        function renderComments() {
            document.getElementById('commentCount').textContent = `(${comments.length})`;
            const list = document.getElementById('commentList');

            list.innerHTML = comments.map(c => {
                const isShown = c.id === shownCommentId;
                return `
                    <li class="px-3 sm:px-4 py-3 ${isShown ? 'bg-cyan-500/10' : 'hover:bg-zinc-800/40'} transition-colors">
                        <div class="flex justify-between items-start gap-3">
                            <div class="min-w-0">
                                <p class="text-xs font-bold text-white">${escapeHtml(c.username)} <span class="text-zinc-600 font-normal ml-1">${c.time}</span></p>
                                <p class="text-xs text-zinc-300 mt-1 break-words">${escapeHtml(c.message)}</p>
                            </div>
                            <button onclick="showComment(${c.id})"
                                    class="shrink-0 px-3 py-2 ${isShown ? 'bg-cyan-600 border-cyan-500 text-white' : 'bg-zinc-800 hover:bg-zinc-700 border-zinc-700 text-zinc-200'} active:scale-95 rounded-lg text-[10px] font-bold uppercase tracking-wider border transition-all">
                                ${isShown ? 'Showing' : 'Show'}
                            </button>
                        </div>
                    </li>
                `;
            }).join('');

            renderOnScreen();
        }

        function renderOnScreen() {
            const box = document.getElementById('onScreenText');
            const c = comments.find(x => x.id === shownCommentId);
            box.innerHTML = c
                ? `<span class="text-white font-bold">${escapeHtml(c.username)}:</span> ${escapeHtml(c.message)}`
                : `<span class="text-zinc-500 italic">Nothing shown.</span>`;
        }

        // Trigger: set the comment as on screen (static for now, no overlay yet)
        function showComment(id) {
            shownCommentId = id;
            renderComments();
        }

        function clearShown() {
            shownCommentId = null;
            renderComments();
        }

        renderViewers();
        renderComments();
    </script>
</body>
</html>
