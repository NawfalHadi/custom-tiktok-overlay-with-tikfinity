<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Control Panel // Admin HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto space-y-6">

        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-zinc-800 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-wider text-cyan-400 uppercase">// News Control Panel</h1>
                <p class="text-xs text-zinc-500 mt-1">Create news entries with text, subtext, transition image, and overlay image.</p>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-semibold text-zinc-400 uppercase tracking-widest">System Online</span>
            </div>
        </div>

        <!-- Input Form -->
        <form id="newsForm" onsubmit="handleSubmit(event)" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl space-y-5">

            <!-- News Text -->
            <div class="space-y-2">
                <label for="newsText" class="block text-xs font-bold uppercase tracking-widest text-cyan-400">News Text</label>
                <input type="text" id="newsText" placeholder="Enter headline..." required
                       class="w-full bg-zinc-950 text-sm px-4 py-2.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-cyan-500 text-white transition-all">
            </div>

            <!-- Subtext -->
            <div class="space-y-2">
                <label for="subText" class="block text-xs font-bold uppercase tracking-widest text-cyan-400">Subtext</label>
                <textarea id="subText" rows="3" placeholder="Enter supporting text..."
                          class="w-full bg-zinc-950 text-sm px-4 py-2.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-cyan-500 text-white transition-all"></textarea>
            </div>

            <!-- Transition Image -->
            <div class="space-y-2 border-t border-zinc-800 pt-5">
                <label class="block text-xs font-bold uppercase tracking-widest text-amber-400">Transition Image <span class="text-red-400">*</span></label>
                <input type="text" id="transitionUrl" placeholder="Image URL or file path (e.g. https://... or C:/images/news.png)"
                       oninput="previewImage('transitionUrl', 'transitionPreview')"
                       class="w-full bg-zinc-950 text-sm px-4 py-2.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-amber-500 text-white transition-all">
                <input type="file" id="transitionFile" accept="image/*" onchange="fileToPreview('transitionFile', 'transitionUrl', 'transitionPreview')"
                       class="block w-full text-xs text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border file:border-zinc-700 file:bg-zinc-800 file:text-zinc-200 file:text-xs file:font-bold hover:file:bg-zinc-700 cursor-pointer">
                <img id="transitionPreview" alt="" class="hidden mt-2 max-h-40 rounded-xl border border-zinc-800 object-cover">
            </div>

            <!-- Overlay Image (input only, overlay not built yet) -->
            <div class="space-y-2 border-t border-zinc-800 pt-5">
                <label class="block text-xs font-bold uppercase tracking-widest text-emerald-400">Overlay Image <span class="text-zinc-600 normal-case tracking-normal">(optional, overlay display coming later)</span></label>
                <input type="text" id="overlayUrl" placeholder="Image URL or file path..."
                       oninput="previewImage('overlayUrl', 'overlayPreview')"
                       class="w-full bg-zinc-950 text-sm px-4 py-2.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-emerald-500 text-white transition-all">
                <input type="file" id="overlayFile" accept="image/*" onchange="fileToPreview('overlayFile', 'overlayUrl', 'overlayPreview')"
                       class="block w-full text-xs text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border file:border-zinc-700 file:bg-zinc-800 file:text-zinc-200 file:text-xs file:font-bold hover:file:bg-zinc-700 cursor-pointer">
                <img id="overlayPreview" alt="" class="hidden mt-2 max-h-40 rounded-xl border border-zinc-800 object-cover">
            </div>

            <!-- Image Highlight Text -->
            <div class="space-y-2 border-t border-zinc-800 pt-5">
                <label for="highlightText" class="block text-xs font-bold uppercase tracking-widest text-sky-400">Image Highlight Text <span class="text-zinc-600 normal-case tracking-normal">(optional, shown on overlay image)</span></label>
                <input type="text" id="highlightText" placeholder="Enter highlight text..."
                       class="w-full bg-zinc-950 text-sm px-4 py-2.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-sky-500 text-white transition-all">
            </div>

            <!-- Submit -->
            <div class="flex items-center justify-between border-t border-zinc-800 pt-5 gap-4">
                <span id="statusMsg" class="text-xs text-zinc-500"></span>
                <button type="submit" class="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white rounded-xl text-xs font-bold uppercase tracking-wider transition-all border border-cyan-500 shadow-lg shadow-cyan-900/20">
                    Submit News
                </button>
            </div>
        </form>

        <!-- Submitted List (session only) -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="bg-zinc-950 px-6 py-3 border-b border-zinc-800 text-xs font-bold uppercase tracking-widest text-zinc-400">
                Submitted News <span id="newsCount" class="text-amber-400">(0)</span>
            </div>
            <ul id="newsList" class="divide-y divide-zinc-800/60">
                <li class="py-6 px-6 text-center text-xs text-zinc-500">No news submitted yet.</li>
            </ul>
        </div>

    </div>

    <script>
        let newsItems = [];

        function previewImage(inputId, previewId) {
            const src = document.getElementById(inputId).value.trim();
            const img = document.getElementById(previewId);
            if (src && /^(https?:|data:|blob:)/i.test(src)) {
                img.src = src;
                img.classList.remove('hidden');
            } else {
                img.removeAttribute('src');
                img.classList.add('hidden');
            }
        }

        function fileToPreview(fileInputId, urlInputId, previewId) {
            const file = document.getElementById(fileInputId).files[0];
            if (!file) return;
            // Store the file as a data URL so it stays usable as an image source
            const reader = new FileReader();
            reader.onload = () => {
                document.getElementById(urlInputId).value = reader.result;
                previewImage(urlInputId, previewId);
            };
            reader.readAsDataURL(file);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const status = document.getElementById('statusMsg');

            const payload = {
                text: document.getElementById('newsText').value.trim(),
                subtext: document.getElementById('subText').value.trim(),
                transitionImage: document.getElementById('transitionUrl').value.trim(),
                overlayImage: document.getElementById('overlayUrl').value.trim(),
                highlightText: document.getElementById('highlightText').value.trim()
            };

            const res = await fetch('/api/admin/news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();

            status.textContent = result.message;
            status.className = result.success ? 'text-xs text-emerald-400' : 'text-xs text-red-400';
            if (result.success) e.target.reset();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function renderList() {
            const list = document.getElementById('newsList');
            document.getElementById('newsCount').textContent = `(${newsItems.length})`;

            if (newsItems.length === 0) {
                list.innerHTML = `<li class="py-6 px-6 text-center text-xs text-zinc-500">No news submitted yet.</li>`;
                return;
            }

            list.innerHTML = newsItems.map(n => `
                <li class="py-4 px-6 hover:bg-zinc-800/40 transition-colors">
                    <p class="font-bold text-white text-sm">${escapeHtml(n.text)}</p>
                    ${n.subtext ? `<p class="text-xs text-zinc-400 mt-1">${escapeHtml(n.subtext)}</p>` : ''}
                    <div class="flex gap-3 mt-2 text-[10px] font-bold uppercase tracking-wider">
                        <span class="text-amber-400">Transition: ${n.transitionImage ? 'set' : 'none'}</span>
                        <span class="text-emerald-400">Overlay: ${n.overlayImage ? 'set' : 'none'}</span>
                    </div>
                </li>
            `).join('');
        }
    </script>
</body>
</html>
