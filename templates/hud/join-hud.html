<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join HUD Broadcast Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --ink: #07070a;
    --bone: #f4f2ea;
    --acid: #e6ff1a;
    --red: #ff2d3d;
    --cyan: #00f0ff;
    --oct: polygon(14% 0, 86% 0, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0 86%, 0 14%);
    --card-cut: polygon(0 0, 88% 0, 100% 24%, 100% 100%, 12% 100%, 0 76%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    width: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    font-family: 'Saira Extra Condensed', 'Arial Narrow', sans-serif;
    color: var(--bone);
    position: relative;
    pointer-events: none;
  }

  /* ---------- Viewport Container ---------- */
  .viewport {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }

  /* ---------- Throw Newspaper Animation Keyframes ---------- */
  @keyframes koranThrow {
    0% {
      transform: translate(var(--throw-x), var(--throw-y)) rotate(var(--throw-angle-start)) scale(2.2);
      opacity: 0;
      filter: blur(8px) drop-shadow(0 20px 40px rgba(0, 0, 0, 0.9));
    }
    22% {
      transform: translate(0, 0) rotate(var(--throw-angle-end)) scale(1);
      opacity: 1;
      filter: blur(0px) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.75));
    }
    27% {
      transform: translate(0, -8px) rotate(calc(var(--throw-angle-end) + 2deg)) scale(1.03);
    }
    32% {
      transform: translate(0, 0) rotate(var(--throw-angle-end)) scale(1);
    }
    82% {
      transform: translate(0, 0) rotate(var(--throw-angle-end)) scale(1);
      opacity: 1;
      filter: blur(0px) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.75));
    }
    100% {
      transform: translate(calc(var(--throw-x) * -0.7), calc(var(--throw-y) * -0.7)) rotate(calc(var(--throw-angle-start) * -1.2)) scale(0.4);
      opacity: 0;
      filter: blur(12px);
    }
  }

  /* ---------- Join HUD Card (Aspect Ratio Width:Height = 2:1) ---------- */
  .paper-card {
    position: absolute;
    width: 380px;
    height: 140px;
    aspect-ratio: 2 / 1;
    background: rgba(11, 11, 16, 0.94);
    border: 2px solid var(--acid);
    clip-path: var(--card-cut);
    box-shadow: inset 0 0 20px rgba(230, 255, 26, 0.12), 0 12px 24px rgba(0, 0, 0, 0.75);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: auto;
    animation: koranThrow 3.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    transform-origin: center center;
    backdrop-filter: blur(8px);
    will-change: transform, opacity;
  }

  /* Glowing Accent Ribbons */
  .paper-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 6px;
    height: 100%;
    background: var(--acid);
    box-shadow: 0 0 12px var(--acid);
  }

  /* ---------- Inner Layout ---------- */
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }

  .tag-top {
    display: inline-flex;
    align-items: center;
    height: 22px;
    padding: 0 12px;
    background: var(--acid);
    color: var(--ink);
    font-size: 15px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 0.12em;
    line-height: 1;
    clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%);
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 800;
    font-style: italic;
    color: var(--red);
    letter-spacing: 0.1em;
    text-shadow: 0 0 8px rgba(255, 45, 61, 0.6);
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
    animation: blink 1s ease-in-out infinite alternate;
  }

  @keyframes blink {
    0% { opacity: 0.3; }
    100% { opacity: 1; }
  }

  .card-body {
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 2;
    margin-top: 4px;
  }

  /* ---------- Profile Frame (Octagonal) ---------- */
  .frame {
    position: relative;
    width: 58px;
    height: 58px;
    flex-shrink: 0;
    padding: 2px;
    clip-path: var(--oct);
    background: linear-gradient(135deg, var(--acid) 0%, #1c1c24 40%, #1c1c24 60%, var(--acid) 100%);
  }

  .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b10;
    clip-path: var(--oct);
  }

  .avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.1) saturate(1.15);
  }

  .avatar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.22) 48%, transparent 58%);
  }

  /* Text Information Block */
  .details {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    flex: 1;
  }

  .name {
    font-size: 24px;
    font-weight: 900;
    font-style: italic;
    color: #ffffff;
    line-height: 0.9;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
  }

  .subtext {
    font-size: 13px;
    font-weight: 800;
    font-style: italic;
    color: var(--acid);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 3px;
    border-top: 1px dashed rgba(230, 255, 26, 0.3);
    padding-top: 2px;
  }
</style>
</head>
<body>

  <!-- Viewport container for multi-stack throw animations -->
  <div class="viewport" id="viewport"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <script>
  (() => {
    const viewport = document.getElementById('viewport');
    const MAX_CARDS = 6;

    const PLACEHOLDER_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#7c3aed"/>' +
      '</linearGradient></defs>' +
      '<rect width="100" height="100" fill="url(#g)"/>' +
      '<circle cx="50" cy="40" r="18" fill="#c7d2fe"/>' +
      '<path d="M18 100c4-22 17-32 32-32s28 10 32 32z" fill="#c7d2fe"/>' +
      '</svg>'
    );

    function spawnPaperThrow(username, avatarUrl) {
      const name = String(username || 'NEW_VIEWER').slice(0, 32);
      const avatar = avatarUrl || PLACEHOLDER_AVATAR;

      const card = document.createElement('div');
      card.className = 'paper-card';

      // Random landing coordinates across the viewport (15% to 70%)
      const randomTop = Math.floor(Math.random() * 55) + 15;
      const randomLeft = Math.floor(Math.random() * 55) + 15;

      // Dynamic newspaper throw trajectories and rotation angles
      const throwAngleStart = (Math.random() * 90 - 45) + 'deg';
      const throwAngleEnd = (Math.random() * 18 - 9) + 'deg';
      const sideX = Math.random() > 0.5 ? 1 : -1;
      const sideY = Math.random() > 0.5 ? 1 : -1;
      const throwX = (sideX * (Math.floor(Math.random() * 400) + 500)) + 'px';
      const throwY = (sideY * (Math.floor(Math.random() * 400) + 300)) + 'px';

      card.style.top = `${randomTop}%`;
      card.style.left = `${randomLeft}%`;
      card.style.setProperty('--throw-x', throwX);
      card.style.setProperty('--throw-y', throwY);
      card.style.setProperty('--throw-angle-start', throwAngleStart);
      card.style.setProperty('--throw-angle-end', throwAngleEnd);

      card.innerHTML = `
        <div class="card-header">
          <span class="tag-top">NEW MEMBER</span>
          <span class="live-badge"><span class="live-dot"></span>JOIN</span>
        </div>
        <div class="card-body">
          <div class="frame">
            <div class="avatar">
              <img src="${avatar}" alt="Avatar" onerror="this.src='${PLACEHOLDER_AVATAR}'">
            </div>
          </div>
          <div class="details">
            <span class="name">@${name}</span>
            <span class="subtext">ENTERED THE STREAM</span>
          </div>
        </div>
      `;

      // Keep active stack bounded
      while (viewport.childElementCount >= MAX_CARDS) {
        viewport.firstElementChild.remove();
      }

      viewport.appendChild(card);

      // Clean up element after animation finishes
      card.addEventListener('animationend', () => card.remove());
      setTimeout(() => card.remove(), 3600);
    }

    /* ===== Live Socket Listener for TikTok Member Events ===== */
    if (typeof io === 'function') {
      try {
        const socket = io({ transports: ['polling'] });
        socket.on('tiktok_event', (res) => {
          if (!res || res.event !== 'member') return;
          const d = res.data || {};
          const nickname = d.nickname || d.uniqueId || 'NEW_VIEWER';
          const avatar =
            d.profilePictureUrl ||
            (d.userDetails && d.userDetails.profilePictureUrls && d.userDetails.profilePictureUrls[0]) ||
            PLACEHOLDER_AVATAR;
          spawnPaperThrow(nickname, avatar);
        });
      } catch (err) {
        console.warn('Socket connection unavailable.', err);
      }
    }
  })();
  </script>
</body>
</html>
