<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join HUD - Ngikut Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --ink: #07070a;
    --bone: #f4f2ea;
    --acid: #e6ff1a;
    --red: #ff2d3d;
    --cyan: #7fe9ff;
    --oct: polygon(14% 0, 86% 0, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0 86%, 0 14%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    font-family: 'Saira Extra Condensed', 'Arial Narrow', sans-serif;
    color: var(--bone);
    pointer-events: none;
  }

  /* Scanline Overlay for cyberpunk broadcast aesthetics */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    background-size: 100% 3px, 6px 100%;
    pointer-events: none;
    z-index: 50;
  }

  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* Dynamic Newspaper Throw & Slam Animation (Width:Height = 2:1 ratio) */
  @keyframes paperThrowHUD {
    0% {
      transform: translate(var(--throw-x), var(--throw-y)) rotate(var(--throw-angle-start)) scale(1.6);
      opacity: 0;
    }
    25% {
      transform: translate(0, 0) rotate(var(--throw-angle-end)) scale(1);
      opacity: 1;
    }
    30% {
      transform: translate(0, -6px) rotate(calc(var(--throw-angle-end) + 2deg));
    }
    35% {
      transform: translate(0, 0) rotate(var(--throw-angle-end));
    }
    82% {
      transform: translate(0, 0) rotate(var(--throw-angle-end));
      opacity: 1;
    }
    100% {
      transform: translate(calc(var(--throw-x) * -0.6), calc(var(--throw-y) * -0.6)) rotate(calc(var(--throw-angle-start) * -0.8)) scale(0.7);
      opacity: 0;
    }
  }

  .join-card {
    position: absolute;
    display: flex;
    align-items: center;
    width: 320px;
    height: 160px; /* Exact 2:1 aspect ratio sizing matching requirements */
    padding: 14px 20px 14px 16px;
    background:
      repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px),
      linear-gradient(100deg, #0e0e16 0%, #07070a 72%);
    border: 1px solid rgba(230, 255, 26, 0.35);
    clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(230, 255, 26, 0.05);
    animation: paperThrowHUD 3.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    will-change: transform, opacity;
  }

  .join-card::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--acid), transparent 70%);
  }

  /* Octagonal Avatar Container */
  .avatar-frame {
    position: relative;
    z-index: 2;
    flex: 0 0 96px;
    width: 96px;
    height: 96px;
    padding: 3px;
    margin-right: 14px;
    clip-path: var(--oct);
    background: linear-gradient(135deg, var(--acid) 0%, #1c1c24 42%, #1c1c24 58%, var(--acid) 100%);
    box-shadow: 0 0 12px rgba(230, 255, 26, 0.3);
  }

  .avatar-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    clip-path: var(--oct);
    background: #0b0b10;
    filter: contrast(1.1) saturate(1.1);
  }

  .panel-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }

  .row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .kicker {
    font-size: 15px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: .26em;
    text-transform: uppercase;
    line-height: 1;
    color: var(--acid);
    text-shadow: 0 0 10px rgba(230, 255, 26, .35);
  }

  .tag {
    display: flex;
    align-items: center;
    height: 22px;
    padding: 0 12px;
    background: var(--red);
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: .16em;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
    clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%);
  }

  .name {
    min-width: 0;
    font-size: 32px;
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
    line-height: 1;
    letter-spacing: .02em;
    color: var(--bone);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sub {
    font-size: 12px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: .22em;
    text-transform: uppercase;
    line-height: 1;
    color: var(--cyan);
    white-space: nowrap;
    border-top: 1px dashed rgba(127, 233, 255, 0.25);
    padding-top: 5px;
    margin-top: 2px;
  }
</style>
</head>
<body class="pointer-events-none">

  <div id="viewport" class="absolute inset-0"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
  (() => {
    const viewport = document.getElementById('viewport');
    const CONFIG = { maxCards: 6 };

    function hueOf(str) {
      let h = 0;
      for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return h % 360;
    }

    function fallbackAvatar(name) {
      const first = (name.trim().charAt(0) || '?').toUpperCase();
      const letter = /[A-Z0-9]/.test(first) ? first : '?';
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
        `<rect width="100" height="100" fill="hsl(${hueOf(name)} 30% 12%)"/>` +
        '<text x="50" y="50" dy=".35em" font-family="Arial,sans-serif" font-weight="800" ' +
        `font-size="56" text-anchor="middle" fill="#e6ff1a">${letter}</text>` +
        '</svg>';
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function spawnPaperThrow(name, avatar) {
      const label = String(name || 'A VIEWER').slice(0, 32);
      const card = document.createElement('div');
      card.className = 'join-card';

      // Random placement across the entire screen viewport boundaries
      const randomTop = Math.floor(Math.random() * 60) + 15;   // 15% to 75%
      const randomLeft = Math.floor(Math.random() * 55) + 10;  // 10% to 65%

      // Dynamic newspaper throw physics / trajectories
      const throwAngleStart = (Math.random() * 50 - 25) + 'deg';
      const throwAngleEnd = (Math.random() * 14 - 7) + 'deg';
      const side = Math.random() > 0.5 ? 1 : -1;
      const throwX = (side * (Math.floor(Math.random() * 350) + 400)) + 'px';
      const throwY = (Math.floor(Math.random() * 400) - 200) + 'px';

      card.style.top = `${randomTop}%`;
      card.style.left = `${randomLeft}%`;
      card.style.setProperty('--throw-x', throwX);
      card.style.setProperty('--throw-y', throwY);
      card.style.setProperty('--throw-angle-start', throwAngleStart);
      card.style.setProperty('--throw-angle-end', throwAngleEnd);

      card.innerHTML = `
        <div class="avatar-frame">
          <img alt="Avatar">
        </div>
        <div class="panel-content">
          <div class="row-top">
            <span class="kicker">Ngikut</span>
            <span class="tag">Welcome</span>
          </div>
          <span class="name"></span>
          <span class="sub">New viewer in frame</span>
        </div>
      `;

      card.querySelector('.name').textContent = label;
      const img = card.querySelector('img');
      img.src = avatar || fallbackAvatar(label);
      img.addEventListener('error', () => { img.src = fallbackAvatar(label); }, { once: true });

      while (viewport.childElementCount >= CONFIG.maxCards) {
        viewport.firstElementChild.remove();
      }
      viewport.appendChild(card);

      card.addEventListener('animationend', () => card.remove());
      setTimeout(() => card.remove(), 3500);
    }

    // Live Socket listener for incoming TikTok join events
    if (typeof io === 'function') {
      try {
        const socket = io({ transports: ['polling'] });
        socket.on('tiktok_event', (res) => {
          if (!res || res.event !== 'member') return;
          const d = res.data || {};
          const nickname = d.nickname || d.uniqueId || 'A VIEWER';
          const avatar =
            d.profilePictureUrl ||
            (d.userDetails && d.userDetails.profilePictureUrls && d.userDetails.profilePictureUrls[0]) ||
            fallbackAvatar(nickname);
          spawnPaperThrow(nickname, avatar);
        });
      } catch (err) {
        console.warn('Socket connection unavailable.', err);
      }
    }
  })();
  </script>
</body>
</html>
