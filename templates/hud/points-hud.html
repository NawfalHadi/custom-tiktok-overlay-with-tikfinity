<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points Check Banner HUD - DGCB Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ink: #07070a;
            --bone: #f4f2ea;
            --acid: #e6ff1a;
            --cyan: #00f0ff;
            --red: #ff2d3d;
            --gold: #ffd700;
            --oct: polygon(14% 0, 86% 0, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0 86%, 0 14%);
            --badge-clip: polygon(12% 0, 100% 0, 88% 100%, 0 100%);
            --card-clip: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Saira Extra Condensed', 'Arial Narrow', sans-serif;
            background: transparent;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            pointer-events: none;
        }

        /* CRT Scanline Overlay Effect */
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        /* Running Ticker Animation */
        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-content {
            display: inline-flex;
            white-space: nowrap;
            animation: tickerScroll 10s linear infinite;
        }

        /* 5-Second Banner Slide-In Animation */
        @keyframes slideLeftToRight {
            0% {
                transform: translateX(-120%) skewX(-12deg);
                opacity: 0;
                filter: blur(10px);
            }
            8% {
                transform: translateX(10px) skewX(-12deg);
                opacity: 1;
                filter: blur(0px);
            }
            12% {
                transform: translateX(0) skewX(-12deg);
                opacity: 1;
            }
            88% {
                transform: translateX(0) skewX(-12deg);
                opacity: 1;
                filter: blur(0px);
            }
            96% {
                transform: translateX(30px) skewX(-12deg);
                opacity: 0.8;
            }
            100% {
                transform: translateX(120%) skewX(-12deg);
                opacity: 0;
                filter: blur(10px);
            }
        }

        .animating-banner {
            animation: slideLeftToRight 5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Octagonal Avatar Container */
        .avatar-oct-frame {
            width: 72px;
            height: 72px;
            padding: 3px;
            clip-path: var(--oct);
            background: linear-gradient(135deg, var(--acid) 0%, #1c1c24 50%, var(--cyan) 100%);
            box-shadow: 0 0 18px rgba(230, 255, 26, 0.4);
            flex-shrink: 0;
        }

        .avatar-oct-inner {
            width: 100%;
            height: 100%;
            clip-path: var(--oct);
            background: #000;
        }

        .hud-badge {
            clip-path: var(--badge-clip);
            font-style: italic;
            font-weight: 900;
            text-transform: uppercase;
        }

        .glow-acid {
            text-shadow: 0 0 15px rgba(230, 255, 26, 0.8), 0 0 25px rgba(230, 255, 26, 0.4);
        }

        .btn-hud {
            pointer-events: auto;
            clip-path: var(--badge-clip);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .btn-hud:hover {
            filter: drop-shadow(0 0 10px rgba(230, 255, 26, 0.7));
            transform: translateY(-1px);
        }
        .btn-hud:active {
            transform: translateY(1px) scale(0.96);
        }

        /* Progress Bar Timer Animation (5 Seconds Sync) */
        @keyframes timerProgress {
            0% { width: 100%; }
            100% { width: 0%; }
        }
        .animating-banner .timer-bar {
            animation: timerProgress 5s linear forwards;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-start items-center pt-12">

    <!-- RECTANGULAR BANNER HUD OVERLAY (!POINTS CHECK) -->
    <div id="points-banner-container" class="relative hidden z-40 transform -skew-x-12 origin-center">
        
        <div class="relative flex flex-col w-[560px] bg-zinc-950/95 border-2 border-[var(--acid)] shadow-[0_0_40px_rgba(0,0,0,0.9)] overflow-hidden">
            
            <div class="absolute inset-0 scanlines opacity-50 z-30 pointer-events-none"></div>

            <!-- TOP RUNNING TICKER HEADER -->
            <div class="w-full h-5 bg-black border-b border-[var(--acid)] flex items-center overflow-hidden">
                <div class="ticker-content text-[var(--acid)] font-black italic tracking-[0.25em] text-[10px] uppercase">
                    ⚡ KERAJAAN DGCB TELEMETRY /// STATUS POIN KESATRIA /// CHECK COMMAND RECEIVED (!POINTS) /// KERAJAAN DGCB TELEMETRY ///
                </div>
            </div>

            <!-- MAIN BODY CONTENT -->
            <div class="relative flex items-center justify-between px-4 py-3 gap-4">
                
                <!-- LEFT: AVATAR -->
                <div class="relative z-20 flex items-center space-x-3">
                    <div class="avatar-oct-frame relative">
                        <div class="avatar-oct-inner">
                            <img id="user-avatar-img" 
                                 src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80" 
                                 alt="Avatar Kesatria" class="w-full h-full object-cover grayscale contrast-125">
                        </div>
                        <div class="hud-badge absolute -bottom-2 -right-1 bg-[var(--cyan)] text-black text-[9px] font-black italic px-1.5 py-0.2 tracking-wider shadow-md">
                            VERIFIED
                        </div>
                    </div>

                    <div class="flex flex-col">
                        <div class="hud-badge inline-block bg-[var(--acid)] text-black px-2.5 py-0.5 text-xs font-black tracking-wider self-start">
                            @<span id="username-display">PEMENTOLAN</span>
                        </div>
                        <span class="text-white text-sm font-black italic tracking-wider uppercase mt-1">
                            COMMAND <span class="text-[var(--cyan)]">!POINTS</span>
                        </span>
                        <span class="text-[10px] font-black italic tracking-widest text-zinc-400 uppercase">
                            STATUS: <span class="text-[var(--acid)]">ACTIVE KESATRIA</span>
                        </span>
                    </div>
                </div>

                <!-- RIGHT: POINTS TELEMETRY -->
                <div class="flex flex-col items-end justify-center pr-2">
                    <span class="text-[10px] font-black italic tracking-widest text-zinc-400 uppercase leading-none">TOTAL POIN SAYA</span>
                    <div class="flex items-baseline space-x-1 mt-0.5">
                        <span id="points-count-display" class="text-4xl font-black italic tracking-tight text-[var(--acid)] glow-acid leading-none">
                            1,450
                        </span>
                        <span class="text-xs font-black italic text-zinc-400">PTS</span>
                    </div>
                    <span class="hud-badge text-[9px] text-black bg-[var(--cyan)] px-2 py-0.2 font-black tracking-widest mt-1">
                        KERAJAAN TELEMETRY
                    </span>
                </div>

            </div>

            <!-- BOTTOM TIMER PROGRESS BAR -->
            <div class="w-full h-1.5 bg-zinc-900 overflow-hidden relative">
                <div id="banner-timer-bar" class="timer-bar h-full bg-gradient-to-r from-[var(--acid)] via-[var(--cyan)] to-[var(--acid)]"></div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('overlay')) {
            const ctrlBar = document.getElementById('control-bar');
            if (ctrlBar) ctrlBar.style.display = 'none';
        }

        let activeTimeout = null;
        const bannerContainer = document.getElementById('points-banner-container');

        // Web Audio Synth sound effect generator
        function playHudsfx() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } catch (e) {
                // Audio context suppressed
            }
        }

        function triggerPointsBanner(username, points, avatarUrl) {
            if (activeTimeout) {
                clearTimeout(activeTimeout);
            }

            if (username) {
                document.getElementById('username-display').innerText = username.toUpperCase();
            }
            if (points != null) {
                document.getElementById('points-count-display').innerText = Number(points).toLocaleString();
            }
            if (avatarUrl) {
                document.getElementById('user-avatar-img').src = avatarUrl;
            }

            playHudsfx();

            bannerContainer.classList.remove('hidden');
            bannerContainer.classList.remove('animating-banner');
            void bannerContainer.offsetWidth; // Reflow
            bannerContainer.classList.add('animating-banner');

            activeTimeout = setTimeout(() => {
                bannerContainer.classList.remove('animating-banner');
                bannerContainer.classList.add('hidden');
            }, 5000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerPointsBanner('PEMENTOLAN', 1450, 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80');
            }
        });

        // Socket.io Real-Time Listener
        try {
            const socket = io({ transports: ['polling'] });

            socket.on('trigger_points_check', (data) => {
                if (data) {
                    triggerPointsBanner(data.username, data.points, data.avatarUrl);
                }
            });
        } catch (err) {
            console.log('Socket fallback mode active.');
        }
    </script>
</body>
</html>
