<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upeti Bumper Transition - Fullscreen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Oswald', sans-serif;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: transparent;
        }
        
        .wipe-panel {
            width: 200vw;
            height: 120vh;
            left: -50vw;
            top: -10vh;
            transform-origin: center;
            transform: skewX(-15deg) translateX(-100%);
            position: absolute;
        }

        @keyframes wipeDarkIn {
            0% { transform: skewX(-15deg) translateX(-120%); }
            12% { transform: skewX(-15deg) translateX(0%); }
            82% { transform: skewX(-15deg) translateX(0%); }
            95% { transform: skewX(-15deg) translateX(120%); }
            100% { transform: skewX(-15deg) translateX(120%); }
        }

        @keyframes wipeEmeraldIn {
            0%, 5% { transform: skewX(-15deg) translateX(-120%); }
            17% { transform: skewX(-15deg) translateX(0%); }
            77% { transform: skewX(-15deg) translateX(0%); }
            90% { transform: skewX(-15deg) translateX(120%); }
            100% { transform: skewX(-15deg) translateX(120%); }
        }

        .animating .wipe-dark { animation: wipeDarkIn 3.5s linear forwards; }
        .animating .wipe-emerald { animation: wipeEmeraldIn 3.5s linear forwards; }

        @keyframes contentFade {
            0%, 15% { opacity: 0; }
            18% { opacity: 1; }
            74% { opacity: 1; }
            77%, 100% { opacity: 0; }
        }
        .animating .content-layer { animation: contentFade 3.5s linear forwards; }

        @keyframes bannerExpand {
            0%, 18% { transform: scaleX(0); opacity: 0; }
            21% { transform: scaleX(1); opacity: 1; }
            72% { transform: scaleX(1); opacity: 1; }
            75%, 100% { transform: scaleX(0); opacity: 0; }
        }
        .animating .banner-bg { animation: bannerExpand 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes profilePop {
            0%, 19% { transform: scale(0) rotate(-45deg); opacity: 0; filter: blur(10px); }
            23% { transform: scale(1.1) rotate(0deg); opacity: 1; filter: blur(0px); }
            26% { transform: scale(1) rotate(0deg); opacity: 1; }
            70% { transform: scale(1) rotate(0deg); opacity: 1; }
            73%, 100% { transform: scale(0) rotate(45deg); opacity: 0;}
        }
        .animating .profile-container { animation: profilePop 3.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }

        @keyframes textSlam {
            0%, 21% { transform: scale(3) translateY(-20px); opacity: 0; filter: blur(15px); }
            24% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0px); }
            70% { transform: scale(1.03) translateY(0); opacity: 1; filter: blur(0px); }
            73%, 100% { transform: scale(0.6) translateY(20px); opacity: 0; filter: blur(10px); }
        }
        .animating .main-text { animation: textSlam 3.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }

        @keyframes flashHit {
            0%, 23% { opacity: 0; }
            24% { opacity: 1; }
            28%, 100% { opacity: 0; }
        }
        .animating .hit-flash { animation: flashHit 3.5s linear forwards; }

        @keyframes lightSweep {
            0%, 30% { left: -100%; opacity: 0; }
            31% { opacity: 0.5; }
            50% { left: 200%; opacity: 0.5; }
            51%, 100% { left: 200%; opacity: 0; }
        }
        .animating .text-glare { animation: lightSweep 3.5s linear forwards; }

        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-content {
            display: inline-flex;
            white-space: nowrap;
            animation: tickerScroll 15s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        .globe-ring-1 { animation: spin 20s linear infinite; }
        .globe-ring-2 { animation: spin-reverse 15s linear infinite; }

        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
            background-size: 100% 4px;
            pointer-events: none;
        }

        .glow-text-white { text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.3); }
        .glow-text-yellow { text-shadow: 0 0 15px rgba(250, 204, 21, 0.8), 0 0 30px rgba(234, 179, 8, 0.5); }
    </style>
</head>
<body class="w-full h-screen flex items-center justify-center">

    <div class="fullscreen-container">
        <div id="transition-overlay" class="absolute inset-0 z-50 overflow-hidden pointer-events-none hidden">
            
            <!-- DARK WIPE PANEL -->
            <div class="wipe-panel wipe-dark bg-slate-950 border-r-[10px] border-emerald-600 shadow-[20px_0_50px_rgba(0,0,0,0.9)] z-10"></div>
            
            <!-- EMERALD GRADIENT WIPE PANEL -->
            <div class="wipe-panel wipe-emerald bg-gradient-to-r from-emerald-950 via-emerald-800 to-emerald-600 border-r-[15px] border-yellow-400 shadow-[30px_0_50px_rgba(0,0,0,0.95)] z-20">
                <div class="absolute inset-0 scanlines opacity-50"></div>
            </div>

            <!-- CONTENT LAYER -->
            <div class="content-layer absolute inset-0 z-30 flex flex-col items-center justify-center opacity-0">
                
                <div class="hit-flash absolute inset-0 bg-yellow-300 opacity-0 z-50 pointer-events-none mix-blend-overlay"></div>

                <!-- ROTATING GRAPHICS BACKDROP -->
                <div class="absolute inset-0 flex items-center justify-center overflow-hidden opacity-25">
                    <div class="globe-ring-1 absolute w-[60vh] h-[60vh] border-[2px] border-dashed border-yellow-400 rounded-full"></div>
                    <div class="globe-ring-2 absolute w-[42vh] h-[42vh] border-[4px] border-dotted border-emerald-300 rounded-full"></div>
                </div>

                <!-- TOP TICKER -->
                <div class="absolute top-[22%] w-full h-9 bg-black/90 border-t-2 border-b-2 border-yellow-400 flex items-center overflow-hidden shadow-lg transform -skew-x-12 origin-left">
                    <div class="ticker-content text-yellow-400 font-bold tracking-[0.2em] text-sm uppercase">
                        UPETI COMMAND NETWORK /// SPECIAL TRIBUTE DISPATCHED /// LIVE SUPPORTER BROADCAST /// UPETI COMMAND NETWORK /// 
                    </div>
                </div>

                <!-- PROFILE CIRCLE SECTION -->
                <div class="profile-container relative z-40 mb-6 flex flex-col items-center opacity-0">
                    <div class="relative w-40 h-40 rounded-full p-1 bg-gradient-to-tr from-emerald-500 via-yellow-400 to-amber-300 shadow-[0_0_35px_rgba(250,204,21,0.7)]">
                        <div class="w-full h-full rounded-full bg-slate-950 p-1 flex items-center justify-center overflow-hidden border-2 border-slate-900">
                            <img id="user-profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80" alt="User Profile" class="w-full h-full object-cover rounded-full filter contrast-110">
                        </div>
                        <div class="absolute bottom-1 right-1 bg-emerald-600 text-white text-[11px] font-black uppercase px-2.5 py-0.5 rounded-full border-2 border-black tracking-wider shadow-md animate-pulse">
                            TOP UPETI!
                        </div>
                    </div>
                </div>

                <!-- MAIN BANNER TEXT -->
                <div class="relative w-full flex items-center justify-center z-40">
                    <div class="banner-bg absolute w-[110%] h-[120px] bg-slate-950 border-y-4 border-yellow-400 shadow-[0_0_60px_rgba(0,0,0,0.9)] origin-center skew-x-[-6deg]"></div>
                    
                    <div class="main-text relative z-10 flex flex-col items-center">
                        <div class="relative overflow-hidden px-6 py-1">
                            <div class="text-5xl font-black italic tracking-tighter leading-none flex flex-col items-center gap-1">
                                <span class="text-white glow-text-white uppercase">PEMBERI UPETI</span>
                                <span class="text-yellow-400 glow-text-yellow uppercase">TELAH DATANG</span>
                            </div>
                            <div class="text-glare absolute top-0 w-28 h-[150%] bg-white/40 transform skew-x-[-30deg] blur-md pointer-events-none"></div>
                        </div>
                        <div id="username-tag" class="bg-emerald-600 text-white px-5 py-1 text-sm font-black tracking-widest uppercase mt-2 z-20 shadow-lg border border-yellow-400">
                            @USERNAME
                        </div>
                    </div>
                </div>

                <!-- BOTTOM TICKER -->
                <div class="absolute bottom-[22%] w-full h-9 bg-black/90 border-t-2 border-b-2 border-emerald-500 flex items-center overflow-hidden shadow-lg transform -skew-x-12 origin-right">
                    <div class="ticker-content text-emerald-300 font-bold tracking-[0.2em] text-sm uppercase" style="animation-direction: reverse;">
                        STAND BY FOR STREAM UPDATE /// RECORD REGISTERED /// STAND BY FOR STREAM UPDATE /// RECORD REGISTERED /// 
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io({ transports: ['polling'] });

        const overlay = document.getElementById('transition-overlay');
        let isAnimating = false;

        socket.on('trigger_upeti_transition', (data) => {
            if (isAnimating) return;
            isAnimating = true;

            if (data && data.avatarUrl) {
                document.getElementById('user-profile-img').src = data.avatarUrl;
            }

            if (data && data.username) {
                document.getElementById('username-tag').innerText = `@${data.username.toUpperCase()}`;
            }

            overlay.classList.remove('hidden');
            overlay.classList.remove('animating');
            void overlay.offsetWidth; // Force reflow
            overlay.classList.add('animating');

            setTimeout(() => {
                overlay.classList.remove('animating');
                overlay.classList.add('hidden');
                isAnimating = false;
            }, 3600); 
        });
    </script>
</body>
</html>
