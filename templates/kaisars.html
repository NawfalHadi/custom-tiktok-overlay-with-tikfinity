<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaisar News Overlay - Horizontal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Oswald', sans-serif;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-content {
            display: inline-flex;
            white-space: nowrap;
            animation: tickerScroll 15s linear infinite;
        }

        /* Efek Animasi Muncul Saat Gift Masuk */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-end justify-between p-8 bg-transparent">

    <!-- BAGIAN KIRI & BAWAH: Banner Utama, Logo Ungu, Teks Hijau, & Ticker -->
    <div class="flex flex-col w-[700px] gap-1">
        
        <!-- RUNNING TEXT -->
        <div class="w-full h-7 bg-black/90 border-t border-b border-red-500 flex items-center overflow-hidden shadow-lg transform -skew-x-6">
            <div class="ticker-content text-yellow-400 font-bold tracking-[0.2em] text-xs uppercase">
                KAISAR NEWS EKSKLUSIF // SELAMAT DATANG KAISAR BARU // LIVE UPDATE TIKTOK LIVE // KAISAR NEWS EKSKLUSIF // 
            </div>
        </div>

        <!-- BARIS UTAMA (Ungu, Hijau, Oranye) -->
        <div class="flex items-stretch gap-2 w-full h-16">
            
            <!-- LINGKARAN UNGU: Logo / Kaisar News -->
            <div class="bg-yellow-400 text-black px-6 flex flex-col justify-center items-center font-black italic tracking-tighter skew-x-[-6deg] shadow-lg border-2 border-black">
                <span class="text-xs tracking-widest uppercase leading-none text-zinc-900">KAISAR</span>
                <span class="text-2xl leading-none">NEWS</span>
            </div>

            <!-- LINGKARAN HIJAU & ORANYE: Username & Template Teks -->
            <div class="flex-1 bg-black/90 border-y-2 border-yellow-400 flex flex-col justify-center px-6 skew-x-[-6deg] shadow-lg">
                <!-- Teks Username Dinamis -->
                <div id="user-title" class="text-yellow-400 font-extrabold text-base tracking-wide uppercase truncate">
                    @pementolan <span class="text-white font-normal">telah menjadi kaisar</span>
                </div>
                <div class="text-white text-xs font-bold tracking-wider uppercase opacity-80">
                    SPECIAL EMPEROR BROADCAST
                </div>
            </div>

        </div>
    </div>

    <!-- BAGIAN KANAN: Foto Profil (Match Parent Height) -->
    <div class="flex flex-col items-center">
        <div class="relative h-80 w-64 bg-black border-4 border-yellow-400 rounded-xl shadow-2xl overflow-hidden flex justify-center items-center transform translate-y-4">
            <!-- Gambar Profil Dinamis -->
            <img id="user-avatar" src="https://p16-common-sign.tiktokcdn.com/tos-alisg-avt-0068/3fe0241618b2a8e8a601af7ad28b7f72~tplv-tiktokx-cropcenter:100:100.webp" alt="Profile Picture" class="h-full w-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-60"></div>
            <div class="absolute bottom-3 bg-red-600 text-white px-3 py-1 text-xs font-bold uppercase tracking-widest rounded shadow">
                New Emperor 👑
            </div>
        </div>
    </div>

    <!-- SCRIPT WEBSOCKET UNTUK MENANGKAP GIFT -->
    <script>
        // Menghubungkan ke WebSocket lokal (misal TikFinity / TikTok Live Bridge)
        const ws = new WebSocket("ws://localhost:21213/");

        ws.onmessage = function (event) {
            try {
                const res = JSON.parse(event.data);
                
                // Cek apakah event yang masuk adalah 'gift'
                if (res.event === "gift") {
                    const d = res.data;
                    
                    // Filter berdasarkan ID Gift (misal: 7934 untuk "Heart Me" sesuai data sebelumnya)
                    const giftId = d.giftId || (d.gift && d.gift.gift_id);
                    
                    if (giftId === 7934) {
                        const username = d.uniqueId || d.nickname || "User";
                        const avatarUrl = d.profilePictureUrl || (d.userDetails && d.userDetails.profilePictureUrls ? d.userDetails.profilePictureUrls[0] : "");

                        // Perbarui teks username secara dinamis
                        const userTitleEl = document.getElementById('user-title');
                        userTitleEl.innerHTML = `@${username} <span class="text-white font-normal">telah menjadi kaisar</span>`;

                        // Perbarui foto profil jika tersedia
                        if (avatarUrl) {
                            document.getElementById('user-avatar').src = avatarUrl;
                        }

                        console.log(`Trigger Kaisar aktif untuk: @${username} (Gift ID: ${giftId})`);
                    }
                }
            } catch (err) {
                console.error("Gagal memparsing data WebSocket:", err);
            }
        };

        ws.onopen = () => console.log("Terhubung ke WebSocket Gift Listener!");
        ws.onclose = () => console.log("Koneksi WebSocket terputus.");
    </script>
</body>
</html>
