<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Ending Credits - Cyberpunk HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:ital,wght@0,600;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ink: #07070a;
            --bone: #f4f2ea;
            --acid: #e6ff1a;
            --red: #ff2d3d;
            --cyan: #00f0ff;
            --oct: polygon(14% 0, 86% 0, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0 86%, 0 14%);
            --badge-clip: polygon(12% 0, 100% 0, 88% 100%, 0 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Saira Extra Condensed', 'Arial Narrow', sans-serif;
            margin: 0;
            overflow: hidden;
            background: transparent !important;
            color: var(--bone);
        }

        /* Cinematic Credit Crawl Animation */
        @keyframes crawl {
            0% { transform: translateY(100vh); opacity: 0; }
            8% { opacity: 1; }
            92% { opacity: 1; }
            100% { transform: translateY(-150vh); opacity: 0; }
        }

        .credits-crawl {
            animation: crawl 25s linear infinite;
        }

        /* Cyberpunk HUD Styling Elements */
        .hud-badge {
            clip-path: var(--badge-clip);
            font-style: italic;
            font-weight: 900;
            text-transform: uppercase;
        }

        .glow-acid {
            text-shadow: 0 0 15px rgba(230, 255, 26, 0.6), 0 0 30px rgba(230, 255, 26, 0.3);
        }

        .glow-cyan {
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .hud-border-box {
            background: rgba(11, 11, 17, 0.85);
            border: 1px solid rgba(230, 255, 26, 0.35);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(230, 255, 26, 0.05);
            clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative overflow-hidden text-white bg-transparent">

    <!-- Main Scrolling Credits Container -->
    <div class="relative z-30 w-full max-w-xl h-full flex flex-col items-center overflow-hidden text-center">
        <div id="credits-wrapper" class="credits-crawl absolute flex flex-col items-center space-y-12 py-32 w-full">
            
            <!-- HEADER LOGO / TITLE -->
            <div class="space-y-2 flex flex-col items-center">
                <span class="hud-badge inline-block bg-[var(--acid)] text-[var(--ink)] px-4 py-1 text-xs tracking-widest">
                    ⚡ SPECIAL APPRECIATION ⚡
                </span>
                <h1 class="text-7xl font-black italic tracking-wider text-[var(--acid)] glow-acid uppercase leading-none">
                    STREAM CREDITS
                </h1>
                <div class="w-32 h-1 bg-gradient-to-r from-transparent via-[var(--acid)] to-transparent mt-2"></div>
            </div>

            <!-- COMMUNITY SECTION -->
            <div class="space-y-1">
                <h2 class="text-3xl font-black italic tracking-widest text-[var(--cyan)] glow-cyan uppercase">
                    COMMUNITY SUPPORTERS
                </h2>
                <p class="text-xs font-bold italic text-zinc-400 tracking-widest uppercase">
                    Terima kasih kepada seluruh pementol & kesatria yang telah bergabung
                </p>
            </div>

            <!-- DYNAMIC MEMBERS LIST INJECTED HERE -->
            <div id="members-credit-list" class="flex flex-col items-center space-y-6 w-full px-8">
                <!-- Injected dynamically via script -->
            </div>

            <!-- FOOTER SIGN OFF -->
            <div class="space-y-3 pt-8 flex flex-col items-center">
                <div class="w-24 h-0.5 bg-[var(--acid)] opacity-40 mb-2"></div>
                <div class="text-4xl font-black italic tracking-wider text-white glow-cyan uppercase">
                    TERIMA KASIH TELAH MENONTON!
                </div>
                <div class="hud-badge bg-[var(--red)] text-white px-5 py-1 text-sm font-black tracking-widest uppercase">
                    SAMPAI JUMPA DI LIVE STREAM BERIKUTNYA
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io({ transports: ['polling'] });

        function loadEndingMembers() {
            console.log("Fetching members from /api/members...");
            fetch('/api/members')
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return res.json();
                })
                .then(members => {
                    console.log("Members received:", members);
                    const container = document.getElementById('members-credit-list');
                    if (!container) return;
                    container.innerHTML = '';

                    if (!Array.isArray(members) || members.length === 0) {
                        container.innerHTML = `<div class="hud-badge text-zinc-500 italic text-sm">NO MEMBERS RECORDED YET</div>`;
                        return;
                    }

                    members.forEach(m => {
                        const item = document.createElement('div');
                        item.className = "hud-border-box w-full max-w-md py-3 px-6 flex flex-col items-center space-y-0.5 transform hover:scale-105 transition-transform duration-300";
                        
                        const name = m.username || m.uniqueId || 'User';
                        item.innerHTML = `
                            <div class="text-2xl font-black italic tracking-wider text-white drop-shadow">@${name.toUpperCase()}</div>
                            <div class="text-xs font-extrabold italic tracking-widest text-[var(--acid)] uppercase">KESATRIA MEMBER</div>
                        `;
                        container.appendChild(item);
                    });
                })
                .catch(err => console.error("Error loading members for ending credits:", err));
        }

        document.addEventListener('DOMContentLoaded', loadEndingMembers);
    </script>
</body>
</html>
